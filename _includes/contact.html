<div class="row g-5 mb-5">
  <div>
    {% for contact in site.data.settings.contacts %}
    <div class="row g-5 mb-5">
      <div class="col-md-8">
        <p>
          {{ contact.department }}<br>
          {{ contact.institution }}<br>
          {{ contact.institution_address }}
        </p>
        <p>
          <strong>Email:</strong>
          <a href="mailto:{{ contact.email }}">
            {{ contact.email }}
          </a>
        </p>

      </div>
    </div>
    {% endfor %}
  </div>
</div>
