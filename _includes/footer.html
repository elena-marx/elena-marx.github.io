<footer class="pt-5 my-5 text-muted border-top">
  <div class="row">
    <div class="col-md-6 text-end social-media-icons">
      {% for item in site.data.settings.social %}
        <a href="{{ item.link }}" target="_blank" rel="noopener noreferrer" class="ms-3 text-decoration-none">

          {% if item.image %}
            <img src="{{ item.image }}"
                  alt=""
                  style="width:20px;height:20px;vertical-align:middle;">
          {% else %}
            <i class="{{ item.style }} fa-{{ item.icon }} fs-5"></i>
          {% endif %}
        </a>
      {% endfor %}
    </div>
  </div>
</footer>
