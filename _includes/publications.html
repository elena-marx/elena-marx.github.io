<div class="row g-5 mb-5">
  <div>
    <h3 class="fw-bold border-bottom pb-3 mb-5">Publications</h3>
    {% if page.title == "Home" %}
      {% for item in site.data.publications.featured %}
        <p><a href="{{ item.url }}">{{ item.name }}</a></p>
      {% endfor %}
    {% else %}
      {% for year in site.data.publications %}
        <h4 class="fw-bold mt-4">{{ year[0] }}</h4>
        {% for paper in year[1] %}
          <p>
            <a href="{{ paper.url }}">{{ paper.name }}</a>
          </p>
        {% endfor %}
      {% endfor %}        
    {% endif %}
  </div>
</div>
